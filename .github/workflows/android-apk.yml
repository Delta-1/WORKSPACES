name: Android Remote APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-remote-agent/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-remote-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          WORKSPACE_SUPABASE_URL: ${{ secrets.WORKSPACE_SUPABASE_URL }}
          WORKSPACE_SUPABASE_ANON_KEY: ${{ secrets.WORKSPACE_SUPABASE_ANON_KEY }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workspace-remote-android-debug
          path: android-remote-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
