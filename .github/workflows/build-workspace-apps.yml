name: Build Workspace Apps (EXE + APK)
on:
  workflow_dispatch:
    inputs:
      workspace_url:
        description: "Endereço HTTPS do site (vazio: configurar no primeiro acesso)"
        required: false
        type: string
  push:
    paths: ["desktop-app/**", "android-workspace/**", ".github/workflows/build-workspace-apps.yml"]
  pull_request:
    paths: ["desktop-app/**", "android-workspace/**", ".github/workflows/build-workspace-apps.yml"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Configure app URL
        working-directory: desktop-app
        env:
          WORKSPACE_APP_URL: ${{ inputs.workspace_url || vars.WORKSPACE_APP_URL }}
        run: node -e "const fs=require('fs');const raw=process.env.WORKSPACE_APP_URL||'';if(raw&&new URL(raw).protocol!=='https:')throw Error('Use HTTPS');fs.writeFileSync('src/config.json',JSON.stringify({url:raw}));"
      - run: npm ci
        working-directory: desktop-app
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Workspace-Windows
          path: desktop-app/dist/Workspace-Setup.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android-workspace
        env:
          WORKSPACE_APP_URL: ${{ inputs.workspace_url || vars.WORKSPACE_APP_URL }}
          WORKSPACE_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Workspace-Android
          path: android-workspace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
