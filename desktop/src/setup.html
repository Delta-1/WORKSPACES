<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline';" />
<title>Workspaces</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #060a12; color: #e5e7eb; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { width: 100%; padding: 28px 24px; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { font-size: 12px; color: #9ca3af; margin: 0 0 16px; }
  input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ffffff22; background: #0b0f16; color: #fff; font-size: 14px; outline: none; }
  input:focus { border-color: #10b981; }
  button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #059669; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #10b981; }
</style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="" />
    <h1>Bem-vindo ao Workspaces</h1>
    <p>Digite o endereço do seu Workspaces para começar.</p>
    <input id="url" type="text" placeholder="ex.: suaempresa.com" autofocus />
    <button id="go">Continuar</button>
  </div>
  <script>
    const input = document.getElementById("url");
    function go() { const v = input.value.trim(); if (v) window.setup.save(v); }
    document.getElementById("go").addEventListener("click", go);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  </script>
</body>
</html>
